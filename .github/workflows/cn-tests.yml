name: "CN Tests"

on:
  push:
    branches: [cn, phase2, phase3, phase35]
  pull_request:
    branches: [cn, phase2, phase3, phase35]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx build.rs 默认下载的静态库是 /MT 编译的，与 whisper-rs 的 /MD 冲突（LNK2038/LNK2005）。
      # 改用官方 static-MD 包，并通过 SHERPA_ONNX_LIB_DIR 让 build.rs 跳过默认下载。
      - uses: ./.github/actions/setup-sherpa-onnx
      # test_get_output_device 需要真实音频输出设备，GitHub runner 上失败并让整个 lib 测试进程 AV 崩溃
      # runner 的 PATH 里另有一个 1.17.1 的 onnxruntime.dll，会让 ort(1.22.x) 初始化失败；
      # 把 build script 下载的 1.22 放到测试 exe 同目录，Windows 先搜应用目录再搜 PATH
      # test_list_system_audio_devices（COM 枚举音频设备）同样依赖真实音频硬件，runner 上必崩（0xc0000005），一并跳过
      - name: cargo test
        run: |
          cargo test --workspace --no-run
          cp frontend/src-tauri/binaries/onnxruntime/*.dll target/debug/deps/
          cargo test --workspace --no-fail-fast -- --test-threads=1 --skip audio::playback_monitor::tests::test_get_output_device --skip audio::system_audio_commands::tests::test_list_system_audio_devices

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm build
      # bun 的 mock.module 是进程级全局状态，测试文件之间会互相污染（上游 summary-language-preferences.test.js 不还原 core 的 mock）；
      # 文件执行顺序在 Linux 上随文件系统变化，逐文件起进程才能得到稳定结果
      - name: bun test
        run: |
          files=$(find tests -type f -name '*.test.*' | sort)
          [ -n "$files" ] || { echo "No test files found"; exit 1; }
          for f in $files; do
            echo "== $f"
            bun test "$f"
          done
