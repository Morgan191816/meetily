name: "CN Tests"

on:
  push:
    branches: [cn]
  pull_request:
    branches: [cn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      # test_get_output_device 需要真实音频输出设备，GitHub runner 上失败并让整个 lib 测试进程 AV 崩溃
      # runner 的 PATH 里另有一个 1.17.1 的 onnxruntime.dll，会让 ort(1.22.x) 初始化失败；
      # 把 build script 下载的 1.22 放到测试 exe 同目录，Windows 先搜应用目录再搜 PATH
      - name: cargo test
        run: |
          cargo test --workspace --no-run
          cp frontend/src-tauri/binaries/onnxruntime/*.dll target/debug/deps/
          cargo test --workspace --no-fail-fast -- --skip audio::playback_monitor::tests::test_get_output_device

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm build
      # bun 的 mock.module 是进程级全局状态，测试文件之间会互相污染（上游 summary-language-preferences.test.js 不还原 core 的 mock）；
      # 文件执行顺序在 Linux 上随文件系统变化，逐文件起进程才能得到稳定结果
      - name: bun test
        run: |
          files=$(find tests -type f -name '*.test.*' | sort)
          [ -n "$files" ] || { echo "No test files found"; exit 1; }
          for f in $files; do
            echo "== $f"
            bun test "$f"
          done
