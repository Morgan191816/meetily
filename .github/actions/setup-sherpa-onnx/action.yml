name: Setup sherpa-onnx static (MD) libs
description: >
  Download the official static-MD build of sherpa-onnx 2.0.1 and point
  SHERPA_ONNX_LIB_DIR at it, so sherpa-onnx-sys build.rs skips its default /MT
  download (which conflicts with whisper-rs's /MD CRT: LNK2038/LNK2005).
  Windows only: callers must guard with `if: contains(..., 'windows')`.

runs:
  using: composite
  steps:
    # 96MB GitHub Release 包，缓存到仓库根 sherpa-onnx-libs/（已在 .gitignore）
    - name: Cache sherpa-onnx static (MD) libs
      id: sherpa-libs
      uses: actions/cache@v4
      with:
        path: sherpa-onnx-libs
        key: sherpa-onnx-2.0.1-win-x64-static-MD-Release-lib
    - name: Fetch sherpa-onnx static (MD) libs
      if: steps.sherpa-libs.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -sSL -o sherpa-md.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-win-x64-static-MD-Release-lib.tar.bz2
        mkdir -p sherpa-onnx-libs
        tar xjf sherpa-md.tar.bz2 -C sherpa-onnx-libs --strip-components=1
        rm sherpa-md.tar.bz2
    - name: Point sherpa-onnx at the static (MD) libs
      shell: bash
      run: |
        libdir="$GITHUB_WORKSPACE/sherpa-onnx-libs/lib"
        test -f "$libdir/sherpa-onnx-c-api.lib" || {
          echo "::error::missing $libdir/sherpa-onnx-c-api.lib (half-populated cache?) — delete the cache key and rerun"
          exit 1
        }
        echo "SHERPA_ONNX_LIB_DIR=$libdir" >> "$GITHUB_ENV"
